services:
  frontend:
    build:
      context: ./client
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./server
      target: runner
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: "postgresql://books:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/books"
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/books?limit=1').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: books
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: books
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U books -d books"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  db-setup:
    build:
      context: ./server
      target: setup
    environment:
      DATABASE_URL: "postgresql://books:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/books"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
